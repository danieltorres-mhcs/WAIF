<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>what again? i forgot.</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--text:#171717;--muted:#737373;--line:#deded9;--line-strong:#c8c8c1;--soft:#f0f0ec;--accent:#171717;--danger:#9b2424;--radius:10px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.shell{width:min(1040px,calc(100% - 32px));margin:auto;padding:28px 0 48px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:42px}.brand{font-size:18px;font-weight:650;letter-spacing:-.02em;text-decoration:none}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,48px);line-height:1.03;letter-spacing:-.045em;margin:0 0 14px}
p{line-height:1.55}.lead{max-width:650px;color:var(--muted);margin:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.input{width:100%;border:1px solid var(--line-strong);background:#fff;color:var(--text);border-radius:7px;padding:11px 12px;outline:none}
.password-card{max-width:460px;margin:12vh auto 0;padding:26px}.lock{width:42px;height:42px;display:block;margin-bottom:20px}.lock path{fill:currentColor}
.password-card h1{font-size:32px;margin-bottom:10px}.password-card p{color:var(--muted);margin-top:0}.password-form{display:grid;gap:10px;margin-top:20px}
.primary,.secondary{border:1px solid var(--line-strong);background:var(--panel);color:var(--text);min-height:40px;padding:0 14px;border-radius:7px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.error{display:none;color:var(--danger);font-size:13px;margin-top:8px}.error.show{display:block}
.message-shell{padding-top:4vh;max-width:900px;margin:auto}.message-meta{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:12px}
.message-title{font-size:15px;font-weight:650}.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.message-output{width:100%;height:min(85vh,760px);max-height:85vh;overflow:auto;padding:clamp(18px,3vw,30px);border:1px solid var(--line);background:#fff;border-radius:var(--radius);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:15px}
.message-output.no-select{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
.copy-row{display:flex;width:100%;margin-top:10px}.copy-btn{width:100%}
.hidden{display:none!important}.burned{text-align:center;padding:18vh 20px}.burned h1{font-size:34px}.burned p{color:var(--muted)}
</style>
</head>
<body>

<div class="shell">
<header class="topbar"><a class="brand" href="/">what again? i forgot.</a><span class="kicker" id="status">private message</span></header>
<main id="gate" class="password-card card">
<svg class="lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M256 160L256 224L384 224L384 160C384 124.7 355.3 96 320 96C284.7 96 256 124.7 256 160zM192 224L192 160C192 89.3 249.3 32 320 32C390.7 32 448 89.3 448 160L448 224C483.3 224 512 252.7 512 288L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 288C128 252.7 156.7 224 192 224z"/></svg>
<h1>Enter the password.</h1><p>The person who sent this should’ve given you a password.</p>
<form id="form" class="password-form"><input id="pw" class="input" type="password" placeholder="Password" autocomplete="off" autofocus><button class="primary">Unlock</button><div id="err" class="error">That password doesn’t work.</div></form>
</main>
<main id="secret" class="message-shell hidden">
<div class="message-meta"><span class="message-title">Message</span><span id="timer" class="timer"></span></div>
<div id="output" class="message-output"></div>
<div id="copyRow" class="copy-row"><button id="copy" class="secondary copy-btn">Copy message</button></div>
</main>
<section id="burned" class="burned hidden"><h1>It’s not there.</h1><p>This message has burned, or doesn't exist.</p></section>
</div>

<script>
// Extract token directly from path (/message/TOKEN)
const pathParts = window.location.pathname.split('/');
const token = pathParts[pathParts.length - 1];

const gate=document.getElementById("gate"), secret=document.getElementById("secret"), burned=document.getElementById("burned"), err=document.getElementById("err"), output=document.getElementById("output");
let timer=null;

function burn(){clearInterval(timer);gate.classList.add("hidden");secret.classList.add("hidden");burned.classList.remove("hidden")}

async function reveal(password=""){
 if(!token){
  err.textContent="This link is invalid.";
  err.classList.add("show");
  return;
 }
 try {
  const res = await fetch('/api/reveal', {
   method: 'POST',
   headers: { 'Content-Type': 'application/json' },
   body: JSON.stringify({ token, password })
  });
  const data = await res.json();
  if(!res.ok){
   if(res.status === 401){
    err.textContent = "That password doesn't work.";
    err.classList.add("show");
   } else {
    burn();
   }
   return;
  }
  show(data);
 } catch(e) {
  burn();
 }
}

function show(c){
 if(c.expiry){
  const end = new Date(c.expiry).getTime();
  const tick=()=>{
   const ms=end-Date.now();
   if(ms<=0)return burn();
   const s=Math.floor(ms/1000);
   document.getElementById("timer").textContent=`Expires in ${Math.floor(s/86400)}d ${String(Math.floor(s%86400/3600)).padStart(2,"0")}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  };
  tick();
  timer=setInterval(tick,1000);
 }

 output.textContent = c.text || "";
 if(!c.copy){
  document.getElementById("copyRow").classList.add("hidden");
  output.classList.add("no-select");
 } else {
  document.getElementById("copyRow").classList.remove("hidden");
  output.classList.remove("no-select");
 }

 gate.classList.add("hidden");
 secret.classList.remove("hidden");
}

document.getElementById("form").addEventListener("submit", e => {
 e.preventDefault();
 reveal(document.getElementById("pw").value);
});

document.getElementById("copy").onclick = async () => {
 await navigator.clipboard.writeText(output.textContent);
 document.getElementById("copy").textContent = "Copied!";
 setTimeout(() => document.getElementById("copy").textContent = "Copy message", 1000);
};

// Attempt passwordless reveal immediately on load
reveal("");
</script>
</body>
</html>
